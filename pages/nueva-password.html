<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Contraseña | EventConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/contraseña.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="row g-0">
                <div class="col-lg-6 d-none d-lg-block auth-illustration">
                    <div class="illustration-content">
                        <i class="bi bi-shield-check" style="font-size: 3rem; margin-bottom: 1.5rem; color: rgba(255,255,255,0.9);"></i>
                        <h3 class="illustration-title">Configura tu nueva clave</h3>
                        <p class="illustration-text">Crea una contraseña segura para proteger tu cuenta.</p>
                        <ul class="features-list" style="list-style: none; padding-left: 0;">
                            <li><i class="bi bi-check-circle"></i> Mínimo 8 caracteres</li>
                            <li><i class="bi bi-check-circle"></i> Letras y números</li>
                            <li><i class="bi bi-check-circle"></i> Evita reutilizar claves</li>
                        </ul>
                    </div>
                </div>

                <div class="col-lg-6">
                    <div class="auth-form">
                        <h1 class="form-title">Nueva contraseña</h1>

                        <form id="newPasswordForm">
                            <div class="mb-4">
                                <label for="newPassword" class="form-label">Contraseña</label>
                                <div class="password-container">
                                    <input type="password" class="form-control" id="newPassword" placeholder="Ingresa tu nueva contraseña" required>
                                    <i class="bi bi-eye-slash password-toggle" id="toggleNewPassword"></i>
                                </div>
                                <small class="text-muted">Debe tener al menos 8 caracteres</small>
                            </div>

                            <div class="mb-4">
                                <label for="confirmNewPassword" class="form-label">Confirmar contraseña</label>
                                <div class="password-container">
                                    <input type="password" class="form-control" id="confirmNewPassword" placeholder="Repite tu nueva contraseña" required>
                                    <i class="bi bi-eye-slash password-toggle" id="toggleConfirmNewPassword"></i>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-save me-2"></i> Guardar nueva contraseña
                            </button>

                            <div class="text-center mt-4">
                                <a href="./login.html" class="auth-link">
                                    <i class="bi bi-box-arrow-in-right"></i> Ir a iniciar sesión
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/nueva-password.js"></script>
</body>
</html>
